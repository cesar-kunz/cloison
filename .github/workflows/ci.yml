# Every pull request and every push to master: the tests on x86-64 Linux,
# as `cargo test --release` runs them locally, and rustfmt and clippy
# (warnings are errors). The slower checks (arm64, the `intl` feature,
# test262) run nightly (nightly.yml).
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # (The toolchain rust-toolchain.toml pins.)
      - run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features intl -- -D warnings
