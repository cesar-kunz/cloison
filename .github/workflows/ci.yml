# Every pull request and every push to master: the tests on x86-64 Linux,
# as `cargo test --release` runs them locally, again with debug
# assertions, the scripts with Rust frames' roots checked, and rustfmt
# and clippy (warnings are errors). The slower
# checks (arm64, the `intl` feature, test262) run nightly (nightly.yml).
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # (The toolchain rust-toolchain.toml pins.)
      - run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  debug-assertions:
    name: Tests (debug assertions)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The release build with `debug_assert!` and the standard library's
      # precondition checks on: what `unsafe` code assumes and release
      # builds don't test (nightly.yml runs test262 so too).
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug-assertions
      - run: cargo test --release

  precise-roots:
    name: Tests (precise Rust roots)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The scripts with the Rust frames' native stack words neither roots
      # nor pins (`CLOISON_GC_NO_NATIVE_ROOTS=drop`) and a collection at
      # every safepoint: a Rust local holding a cell across one that isn't
      # rooted otherwise (`Vm::rooted`) makes its script crash or differ.
      # Each script runs interpreted and compiled (see tests/scripts.rs).
      CLOISON_GC_NO_NATIVE_ROOTS: drop
      CLOISON_GC_STRESS: "1"
      CLOISON_GC_STW: "1"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --test scripts

  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: python3 -I scripts/unsafe-count.py
      # Every raw value taken out of a branded result and bound to a name
      # says why it is safe (`// take:`): the borrow checker can't see it.
      - run: python3 -I scripts/brand-takes.py
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features intl -- -D warnings
