# Once a day (and by hand, from the Actions tab): the tests on arm64 and
# with the `intl` feature, and test262 against the failures known.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  arm64:
    name: Tests (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      # The static musl build the README tests under qemu, run natively.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: env
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --target aarch64-unknown-linux-musl

  intl:
    name: Tests (intl)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --features intl

  test262:
    name: test262
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # (To push the badge's data to the `badges` branch.)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      # (At the commit tests/test262-known-fails.txt was made at.)
      - name: Check out test262
        run: |
          rev=$(sed -n 's/^# test262 //p' tests/test262-known-fails.txt)
          git init -q test262
          git -C test262 fetch -q --depth 1 https://github.com/tc39/test262.git "$rev"
          git -C test262 checkout -q FETCH_HEAD
      - name: Run test262
        id: run
        run: |
          python3 -I scripts/test262-editions.py | tee editions.txt
          { echo '```'; cat editions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Compare with the failures known
        run: python3 -I scripts/test262-check.py tests/test262-known-fails.txt fails-all.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262
          path: |
            editions.tsv
            fails-all.txt
      # The README's test262 badge (shields.io's endpoint badge) reads
      # test262.json on the `badges` branch: one commit, replaced nightly.
      - name: Publish the badge's data
        if: always() && steps.run.outcome == 'success' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir badges && cd badges
          python3 -I - <<'EOF'
          import json
          rows = [l.split('\t') for l in open('../editions.tsv') if l.strip()]
          r = 100 * sum(int(p) for _, p, _ in rows) / sum(int(t) for _, _, t in rows)
          color = 'brightgreen' if r >= 98 else 'green' if r >= 95 else 'yellow'
          json.dump({'schemaVersion': 1, 'label': 'test262', 'message': f'{r:.1f}%', 'color': color},
                    open('test262.json', 'w'))
          EOF
          git init -q -b badges
          git add test262.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "test262: $(python3 -c "import json; print(json.load(open('test262.json'))['message'])")"
          git push -qf "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" badges
