[package]
name = "toi"
version = "0.1.0"
edition = "2024"

[features]
default = ["acc-i32"]
# Accumulator type-state dispatch (see src/interp.rs). Optional so it can be
# benchmarked against plain ANY-state dispatch.
acc-i32 = []

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
debug = "line-tables-only"

[build-dependencies]
object = { version = "0.40", default-features = false, features = ["read_core", "elf"] }
